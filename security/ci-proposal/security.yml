# PROPOSAL — not installed. Copy to .github/workflows/security.yml to adopt.
# This repository has no .github directory at f52f085; CI here is greenfield.
#
# Policy: new scanners start advisory-only (continue-on-error) to establish a
# reviewed baseline, then flip to blocking for newly-introduced Critical/High.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly full lane

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

jobs:
  fast-checks:
    name: PR fast lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         # TODO pin to a SHA before adopting
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      # The one gate that covers every workspace.
      - name: Type check
        run: bun run check-types

      # NOTE: `test` exists only in apps/server and apps/app; `lint` only in apps/app.
      # Adding test scripts to web/dashboard/lite/types is a standing recommendation.
      - name: Tests
        run: bun run test
      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: bun audit
        continue-on-error: true            # advisory until the 20 known dev-only advisories are triaged

      - name: Secret scan (current tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false

      - name: SAST (changed code)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/owasp-top-ten
        continue-on-error: true

  full-lane:
    name: Nightly full lane
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write               # for SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # full history — the shallow default misses old secrets

      - name: Secret scan (FULL history)
        uses: gitleaks/gitleaks-action@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      - name: Build image
        run: docker build -t litechat:${{ github.sha }} .

      - name: Image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: litechat:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      - name: IaC / config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .

      # e2e: pin the browser so the revision mismatch seen during the audit cannot recur.
      - name: E2E
        run: |
          cd e2e
          bunx playwright install --with-deps chromium
          bunx playwright test
