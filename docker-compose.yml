# LiteChat 배포 구성 (Dokploy)
#
# Traefik(Dokploy 내장)이 chat.moveto.kr / litechat.moveto.kr 두 도메인을
# 모두 app:3000 으로 라우팅하면, 서버가 Host 헤더로 사이트를 구분한다.
services:
  app:
    build: .
    restart: unless-stopped
    # 호스트 포트를 공개하지 않는다. Traefik이 dokploy-network를 통해
    # 컨테이너 내부 3000 포트로 직접 라우팅한다(loadbalancer.server.port=3000).
    # 3000:3000 공개는 재배포 시 포트 충돌을 일으키고, Traefik/TLS를 우회해
    # 앱을 인터넷에 직접 노출시키므로 제거한다.
    expose:
      - '3000'
    environment:
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: .moveto.kr        # 두 서브도메인이 세션 쿠키를 공유
      WEB_HOST: chat.moveto.kr
      LITE_HOST: litechat.moveto.kr
      # Web Push (한 번 생성해 Dokploy 환경 변수로 주입):
      #   bunx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:admin@moveto.kr
    volumes:
      - litechat-data:/app/data        # SQLite DB + 업로드 이미지 영속화
    # Traefik(Dokploy)이 컨테이너에 도달하려면 외부 dokploy-network에 연결돼 있어야 한다.
    # (Compose 배포는 Application 타입과 달리 자동 연결되지 않는다)
    networks:
      - dokploy-network
      - default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # oven/bun 이미지에는 wget/curl이 없으므로 런타임에 확실히 존재하는 bun으로 확인한다.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 세션은 재생성 가능하므로 영속화 없이 가볍게 운용한다.
    command: redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  litechat-data:

networks:
  # Dokploy가 Traefik과 함께 사용하는 외부 네트워크. 이 네트워크에 연결돼야
  # chat.moveto.kr / litechat.moveto.kr 로 라우팅된다.
  dokploy-network:
    external: true
  default: {}
