# litechat 배포 구성 (Dokploy)
#
# Traefik(Dokploy 내장)이 chat.moveto.kr / litechat.moveto.kr / dash.moveto.kr
# 세 도메인을 모두 app:3000 으로 라우팅하면, 서버가 Host 헤더로 사이트를 구분한다.
# dash.moveto.kr의 DNS/Traefik 라우팅 등록은 기존 두 서브도메인과 동일한 방식으로
# Dokploy에서 수동으로 추가해야 한다(이 파일만으로는 라우팅이 생기지 않는다).
#
# GeoLite2-City.mmdb(GeoIP 조회용, MaxMind 라이선스 바이너리)는 git에 커밋하지 않고
# litechat-data 볼륨(/app/data/GeoLite2-City.mmdb)에 운영자가 직접 배치해야 한다.
# 파일이 없으면 서버는 위치 조회만 건너뛰고 정상 동작한다.
services:
  app:
    build: .
    restart: unless-stopped
    # 이미지가 USER bun(uid/gid 1000)으로 실행되므로 litechat-data 볼륨도 같은 소유자여야
    # 업로드/SQLite 쓰기가 가능하다. 소유권은 아래 init-data-perms 서비스가 매 배포마다
    # 맞춰주므로 운영자가 수동으로 chown 할 필요는 없다.
    user: '1000:1000'
    # 호스트 포트를 공개하지 않는다. Traefik이 dokploy-network를 통해
    # 컨테이너 내부 3000 포트로 직접 라우팅한다(loadbalancer.server.port=3000).
    # 3000:3000 공개는 재배포 시 포트 충돌을 일으키고, Traefik/TLS를 우회해
    # 앱을 인터넷에 직접 노출시키므로 제거한다.
    expose:
      - '3000'
    environment:
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: .moveto.kr        # 두 서브도메인이 세션 쿠키를 공유
      WEB_HOST: chat.moveto.kr
      LITE_HOST: litechat.moveto.kr
      DASHBOARD_HOST: ${DASHBOARD_HOST:-dash.moveto.kr}
      # Web Push (한 번 생성해 Dokploy 환경 변수로 주입):
      #   bunx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:admin@moveto.kr
      # 관리자 대시보드 지도(Google Maps JS API). 키가 비면 지도는 표시되지 않는다.
      # HTTP 리퍼러(dash.moveto.kr)로 제한된 브라우저 키를 발급해 주입한다.
      # GOOGLE_MAPS_MAP_ID는 AdvancedMarker 렌더링용 — 비우면 개발용 DEMO_MAP_ID 사용.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
      # MaxMind — GeoLite2 DB 주간 자동 갱신 + GeoIP2 Insights 온디맨드 조회.
      # 비워 두면 자동 갱신/Insights만 꺼지고 로컬 mmdb 조회는 계속 동작한다.
      MAXMIND_USER_NUM: ${MAXMIND_USER_NUM:-}
      MAXMIND_API_KEY: ${MAXMIND_API_KEY:-}
    volumes:
      - litechat-data:/app/data        # SQLite DB + 업로드 이미지 영속화
    # Traefik(Dokploy)이 컨테이너에 도달하려면 외부 dokploy-network에 연결돼 있어야 한다.
    # (Compose 배포는 Application 타입과 달리 자동 연결되지 않는다)
    networks:
      - dokploy-network
      - default
    depends_on:
      redis:
        condition: service_healthy
      init-data-perms:
        condition: service_completed_successfully
    healthcheck:
      # oven/bun 이미지에는 wget/curl이 없으므로 런타임에 확실히 존재하는 bun으로 확인한다.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 볼륨 소유권 정렬 (app보다 먼저 1회 실행되고 종료된다).
  #
  # Docker는 "비어 있는" 명명 볼륨을 처음 마운트할 때만 이미지 쪽 디렉터리 소유권을
  # 복사한다. litechat-data는 컨테이너가 root로 돌던 시절에 이미 만들어져 데이터가
  # 들어 있으므로, 나중에 USER bun(uid 1000)으로 바꿔도 볼륨은 root 소유로 남는다.
  # Dockerfile의 `chown -R bun:bun /app`은 빌드 타임 레이어라 런타임 볼륨 마운트에
  # 가려져 아무 효과가 없다 → 앱이 SQLite에 쓰지 못해 부팅 중 죽는다.
  # 그래서 마운트된 볼륨 자체를 root 권한으로 한 번 정렬한 뒤 앱을 띄운다.
  init-data-perms:
    image: busybox:1.36
    user: '0:0'
    command: ['sh', '-c', 'chown -R 1000:1000 /app/data']
    restart: 'no'
    volumes:
      - litechat-data:/app/data
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 세션은 재생성 가능하므로 영속화 없이 가볍게 운용한다.
    command: redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  litechat-data:

networks:
  # Dokploy가 Traefik과 함께 사용하는 외부 네트워크. 이 네트워크에 연결돼야
  # chat.moveto.kr / litechat.moveto.kr 로 라우팅된다.
  dokploy-network:
    external: true
  default: {}
