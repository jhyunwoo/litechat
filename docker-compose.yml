# litechat 배포 구성 (Dokploy)
#
# Traefik(Dokploy 내장)이 chat.moveto.kr / litechat.moveto.kr / lc.moveto.kr /
# dash.moveto.kr 네 도메인을 모두 app:3000 으로 라우팅하면, 서버가 Host 헤더로 사이트를 구분한다.
# dash.moveto.kr의 DNS/Traefik 라우팅 등록은 기존 도메인과 동일한 방식으로
# Dokploy에서 수동으로 추가해야 한다. lc.moveto.kr 별칭은 아래 Traefik 라벨이 담당한다.
#
# GeoLite2-City.mmdb(GeoIP 조회용, MaxMind 라이선스 바이너리)는 git에 커밋하지 않고
# litechat-data 볼륨(/app/data/GeoLite2-City.mmdb)에 운영자가 직접 배치해야 한다.
# 파일이 없으면 서버는 위치 조회만 건너뛰고 정상 동작한다.
services:
  app:
    build: .
    restart: unless-stopped
    # 이미지가 USER bun(uid/gid 1000)으로 실행되므로 litechat-data 볼륨도 같은 소유자여야
    # 업로드/SQLite 쓰기가 가능하다. 소유권은 아래 init-data-perms 서비스가 매 배포마다
    # 맞춰주므로 운영자가 수동으로 chown 할 필요는 없다.
    user: '1000:1000'
    # 호스트 포트를 공개하지 않는다. Traefik이 dokploy-network를 통해
    # 컨테이너 내부 3000 포트로 직접 라우팅한다(loadbalancer.server.port=3000).
    # 3000:3000 공개는 재배포 시 포트 충돌을 일으키고, Traefik/TLS를 우회해
    # 앱을 인터넷에 직접 노출시키므로 제거한다.
    expose:
      - '3000'
    environment:
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: .moveto.kr        # moveto.kr 서브도메인들이 세션 쿠키를 공유
      WEB_HOST: chat.moveto.kr
      LITE_HOST: litechat.moveto.kr
      LITE_HOST_ALIASES: ${LITE_HOST_ALIASES:-lc.moveto.kr}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-dash.moveto.kr}
      # Web Push (한 번 생성해 Dokploy 환경 변수로 주입):
      #   bunx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:admin@moveto.kr
      # 관리자 대시보드 지도(Google Maps JS API). 키가 비면 지도는 표시되지 않는다.
      # HTTP 리퍼러(dash.moveto.kr)로 제한된 브라우저 키를 발급해 주입한다.
      # GOOGLE_MAPS_MAP_ID는 AdvancedMarker 렌더링용 — 비우면 개발용 DEMO_MAP_ID 사용.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
      # MaxMind — GeoLite2 DB 주간 자동 갱신 + GeoIP2 Insights 온디맨드 조회.
      # 비워 두면 자동 갱신/Insights만 꺼지고 로컬 mmdb 조회는 계속 동작한다.
      MAXMIND_USER_NUM: ${MAXMIND_USER_NUM:-}
      MAXMIND_API_KEY: ${MAXMIND_API_KEY:-}
    volumes:
      - litechat-data:/app/data        # SQLite DB + 업로드 이미지 영속화
    # Traefik(Dokploy)이 컨테이너에 도달하려면 외부 dokploy-network에 연결돼 있어야 한다.
    # (Compose 배포는 Application 타입과 달리 자동 연결되지 않는다)
    networks:
      - dokploy-network
      - default
    # lc.moveto.kr 별칭은 Compose 재배포만으로 Traefik 라우팅과 TLS 인증서가 구성된다.
    # 기존 도메인은 Dokploy Domains 탭에서 관리 중이므로 이 별칭만 별도 라우터로 선언한다.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.litechat-lc-moveto.rule=Host(`lc.moveto.kr`)'
      - 'traefik.http.routers.litechat-lc-moveto.entrypoints=websecure'
      - 'traefik.http.routers.litechat-lc-moveto.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.litechat-lc-moveto.service=litechat-lc-moveto'
      - 'traefik.http.services.litechat-lc-moveto.loadbalancer.server.port=3000'
      # 압축 미들웨어 — 정적 자산(js/css/html)은 빌드 시점에 이미 brotli/gzip으로
      # 사전 압축돼 Content-Encoding과 함께 전송되므로 Traefik이 다시 손대지 않는다.
      # 여기서 얻는 것은 **API JSON 응답** 압축이다(대화 목록/메시지 페이지는 한글이라
      # 압축률이 높다). 이미 압축된 이미지(webp/png/jpeg)는 excludedContentTypes로 뺀다 —
      # 재압축은 CPU만 쓰고 크기는 오히려 커진다. 2 OCPU 호스트라 이 구분이 중요하다.
      - 'traefik.http.middlewares.litechat-compress.compress=true'
      - 'traefik.http.middlewares.litechat-compress.compress.excludedContentTypes=image/webp,image/png,image/jpeg,image/gif,font/woff2,application/octet-stream'
      # 아주 작은 응답은 압축 헤더 오버헤드가 이득을 넘는다.
      - 'traefik.http.middlewares.litechat-compress.compress.minResponseBodyBytes=1024'
      - 'traefik.http.routers.litechat-lc-moveto.middlewares=litechat-compress'
    depends_on:
      redis:
        condition: service_healthy
      init-data-perms:
        condition: service_completed_successfully
    healthcheck:
      # oven/bun 이미지에는 wget/curl이 없으므로 런타임에 확실히 존재하는 bun으로 확인한다.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period 동안의 실패는 재시도 횟수에 포함되지 않는다. start_interval을 주면
      # 그 구간에서는 1초마다 확인해, 정상 부팅한 컨테이너가 최대 30초씩 기다리지 않는다.
      start_period: 30s
      start_interval: 1s
    # SIGTERM → 우아한 종료(apps/server/src/index.ts). 서버는 진행 중인 요청을 흘려보낸 뒤
    # 10초 안에 끝내므로, Docker 기본값 10초로는 SIGKILL과 겹칠 수 있어 여유를 둔다.
    stop_grace_period: 20s
    # 컨테이너 로그가 디스크를 채우지 않게 한다 (Dokploy 기본 json-file 드라이버).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          # 2 OCPU / 12 GB 호스트. Sharp의 이미지 변환이 순간적으로 메모리를 쓰므로
          # 넉넉히 잡되, 폭주 시 호스트 전체가 아니라 이 컨테이너만 죽도록 상한을 둔다.
          memory: 3g
        reservations:
          memory: 512m

  # 볼륨 소유권 정렬 (app보다 먼저 1회 실행되고 종료된다).
  #
  # Docker는 "비어 있는" 명명 볼륨을 처음 마운트할 때만 이미지 쪽 디렉터리 소유권을
  # 복사한다. litechat-data는 컨테이너가 root로 돌던 시절에 이미 만들어져 데이터가
  # 들어 있으므로, 나중에 USER bun(uid 1000)으로 바꿔도 볼륨은 root 소유로 남는다.
  # Dockerfile의 `chown -R bun:bun /app`은 빌드 타임 레이어라 런타임 볼륨 마운트에
  # 가려져 아무 효과가 없다 → 앱이 SQLite에 쓰지 못해 부팅 중 죽는다.
  #
  # 다만 매 배포마다 `chown -R /app/data`를 도는 것은 업로드 파일 수에 비례해
  # 배포 시간이 늘어난다는 뜻이다(사진이 쌓일수록 영원히 느려진다). 소유권 정렬은
  # 본질적으로 **한 번만** 필요한 일이므로 완료 표식을 남기고 건너뛴다.
  #  - 표식이 있으면 즉시 종료 (배포 시간 O(1))
  #  - 표식이 없으면 기존과 동일하게 한 번 정렬하고 표식을 남긴다
  #  - 새로 만들어지는 파일은 앱이 uid 1000으로 쓰므로 처음부터 올바른 소유자다
  # 표식을 지우면(`docker run --rm -v litechat-data:/d busybox rm /d/.perms-ok`)
  # 다음 배포에서 다시 전체 정렬이 돈다 — 복구 경로가 열려 있다.
  init-data-perms:
    image: busybox:1.36
    user: '0:0'
    command:
      - sh
      - -c
      - |
        if [ -f /app/data/.perms-ok ]; then
          echo "ownership already normalised — skipping chown"
          exit 0
        fi
        echo "normalising ownership of /app/data (one-off)"
        chown -R 1000:1000 /app/data
        touch /app/data/.perms-ok
        chown 1000:1000 /app/data/.perms-ok
    restart: 'no'
    volumes:
      - litechat-data:/app/data
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 세션은 재생성 가능하므로 영속화 없이 가볍게 운용한다.
    command: redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  litechat-data:

networks:
  # Dokploy가 Traefik과 함께 사용하는 외부 네트워크. 이 네트워크에 연결돼야
  # chat.moveto.kr / litechat.moveto.kr / lc.moveto.kr 로 라우팅된다.
  dokploy-network:
    external: true
  default: {}
